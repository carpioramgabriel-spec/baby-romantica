<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ff477e">

<title>Baby ❤️</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
color:white;
display:flex;
justify-content:center;
align-items:center;

background:
radial-gradient(circle at 20% 20%,#ff9abb 0%,transparent 35%),
radial-gradient(circle at 80% 80%,#9b6cff 0%,transparent 35%),
linear-gradient(135deg,#ff477e,#8b5cf6);

background-size:180% 180%;
animation:fondo 12s ease infinite;
}

@keyframes fondo{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.contenedor{
width:92%;
max-width:430px;
position:relative;
z-index:5;
}

.tarjeta{
padding:35px 25px;
text-align:center;

background:rgba(255,255,255,.16);
border:1px solid rgba(255,255,255,.3);
border-radius:32px;

backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);

box-shadow:
0 25px 70px rgba(0,0,0,.25),
inset 0 1px 1px rgba(255,255,255,.25);

animation:entrada .8s ease;
}

@keyframes entrada{
from{
opacity:0;
transform:translateY(30px) scale(.95);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.corazon{
font-size:72px;
display:inline-block;
animation:latido 1.4s infinite;
}

@keyframes latido{
0%,100%{transform:scale(1)}
50%{transform:scale(1.15)}
}

h1{
margin:15px 0 8px;
font-size:38px;
}

.descripcion{
margin:0 0 25px;
opacity:.9;
}

.botones{
display:flex;
flex-direction:column;
gap:12px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:20px;

font-size:18px;
font-weight:700;

cursor:pointer;

transition:transform .2s;
}

button:active{
transform:scale(.95);
}

.si{
color:#ff477e;
background:white;
}

.no{
color:white;
background:rgba(0,0,0,.18);
border:1px solid rgba(255,255,255,.2);
}

.baby{
display:none;
margin-top:20px;
color:white;

background:
linear-gradient(90deg,#ff477e,#ff6fa0,#a855f7);
}

#mensaje{
margin-top:20px;
min-height:25px;
font-size:17px;
font-weight:600;
}

#zonaExtra{
display:none;
margin-top:25px;
}

.boton-extra{
margin-top:10px;
color:white;
background:rgba(255,255,255,.16);
border:1px solid rgba(255,255,255,.25);
}

.estado{
margin-top:10px;
font-size:14px;
}

#preview{
display:none;
width:100%;
margin-top:15px;
border-radius:20px;
}

#audio{
display:none;
width:100%;
margin-top:15px;
}

.corazon-flotante{
position:fixed;
bottom:-50px;
pointer-events:none;
z-index:1;
animation:subir linear forwards;
}

@keyframes subir{

0%{
transform:translateY(0) rotate(0deg);
opacity:0;
}

15%{
opacity:.9;
}

100%{
transform:translateY(-115vh) rotate(360deg);
opacity:0;
}

}

.brillo{
position:fixed;
width:5px;
height:5px;
border-radius:50%;
background:white;

box-shadow:
0 0 10px white,
0 0 20px white;

animation:brillar 3s infinite;
}

@keyframes brillar{

0%,100%{
opacity:0;
transform:scale(.5);
}

50%{
opacity:.9;
transform:scale(1.5);
}

}

</style>
</head>

<body>

<div class="brillo" style="top:12%;left:18%"></div>
<div class="brillo" style="top:25%;left:80%"></div>
<div class="brillo" style="top:70%;left:15%"></div>
<div class="brillo" style="top:82%;left:75%"></div>


<div class="contenedor">

<div class="tarjeta">

<div class="corazon">❤️</div>

<h1>¿Me quieres?</h1>

<p class="descripcion">
Solo tengo una pequeña pregunta para ti...
</p>


<div class="botones">

<button class="si" onclick="responder(true)">
Sí ❤️
</button>

<button class="no" onclick="responder(false)">
No 😭
</button>

</div>


<button id="baby" class="baby" onclick="continuar()">
Baby ❤️
</button>


<div id="mensaje"></div>


<div id="zonaExtra">

<hr style="border-color:rgba(255,255,255,.2)">

<p>💕 Si quieres compartir algo conmigo...</p>


<button
class="boton-extra"
onclick="abrirCamara()">

📸 Tomar una foto

</button>


<input
id="archivoFoto"
type="file"
accept="image/*"
capture="environment"
style="display:none"
onchange="mostrarFoto(event)"
>


<img id="preview">


<button
class="boton-extra"
onclick="compartirUbicacion()">

📍 Compartir ubicación

</button>


<div id="estadoUbicacion" class="estado"></div>


<audio
id="audio"
controls>
</audio>

</div>

</div>

</div>


<script>

/* =========================
   MÚSICA
========================= */

const musica = new Audio(
"Grupo%20Marrano%20-%20El%20Ansioso.mp3"
);

musica.loop = true;
musica.volume = 0.7;


function iniciarMusica(){

musica.play().catch(()=>{

const audio=document.getElementById("audio");

audio.src=
"Grupo%20Marrano%20-%20El%20Ansioso.mp3";

audio.style.display="block";

});

}


/* =========================
   RESPUESTA
========================= */

function responder(acepto){

iniciarMusica();

const mensaje=
document.getElementById("mensaje");

const baby=
document.getElementById("baby");


if(acepto){

mensaje.innerHTML=
"🥰 Sabía que dirías que sí...";

}else{

mensaje.innerHTML=
"😭 Bueno... todavía hay esperanza.";

}

baby.style.display="block";

}


/* =========================
   BABY
========================= */

function continuar(){

iniciarMusica();

document.getElementById("mensaje").innerHTML=
"💗 Gracias por llegar hasta aquí...";

document.getElementById("zonaExtra").style.display=
"block";

}


/* =========================
   FOTO
========================= */

function abrirCamara(){

document
.getElementById("archivoFoto")
.click();

}


function mostrarFoto(event){

const archivo=
event.target.files[0];

if(!archivo)return;

const preview=
document.getElementById("preview");

preview.src=
URL.createObjectURL(archivo);

preview.style.display=
"block";

}


/* =========================
   UBICACIÓN
========================= */

function compartirUbicacion(){

const estado=
document.getElementById("estadoUbicacion");


if(!navigator.geolocation){

estado.innerHTML=
"❌ Tu navegador no permite ubicación.";

return;

}


estado.innerHTML=
"📍 Solicitando permiso...";


navigator.geolocation.getCurrentPosition(

(posicion)=>{

const lat=
posicion.coords.latitude;

const lon=
posicion.coords.longitude;


const mapa=
"https://www.google.com/maps?q="
+lat+","+lon;


estado.innerHTML="❤️ Ubicación obtenida.";


const enlace=
document.createElement("a");

enlace.href=mapa;

enlace.target="_blank";

enlace.textContent=
"🗺️ Ver ubicación en Google Maps";

enlace.style.display="block";

enlace.style.marginTop="10px";

enlace.style.color="white";

estado.appendChild(enlace);

},

()=>{

estado.innerHTML=
"❌ No se pudo obtener la ubicación.";

},

{

enableHighAccuracy:true,
timeout:10000,
maximumAge:0

}

);

}


/* =========================
   CORAZONES
========================= */

function crearCorazon(){

const lista=[
"❤️","💗","💕","💖","💘","💞"
];

const elemento=
document.createElement("div");

elemento.className=
"corazon-flotante";

elemento.innerHTML=
lista[
Math.floor(Math.random()*lista.length)
];

elemento.style.left=
Math.random()*100+"vw";

elemento.style.fontSize=
(15+Math.random()*25)+"px";

elemento.style.animationDuration=
(5+Math.random()*5)+"s";

document.body.appendChild(elemento);


setTimeout(()=>{

elemento.remove();

},10000);

}


setInterval(crearCorazon,600);

</script>

</body>
</html>
