<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #ff4f81, #9b5de5);
    }

    .card {
      width: 90%;
      max-width: 400px;
      padding: 35px 25px;
      text-align: center;
      background: rgba(255,255,255,.18);
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    h1 {
      font-size: 36px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: none;
      border-radius: 20px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .si {
      background: white;
      color: #ff4f81;
    }

    .no {
      background: rgba(0,0,0,.2);
      color: white;
    }

    #baby {
      display: none;
      background: #ff4f81;
      color: white;
    }
  </style>
</head>

<body>

  <div class="card">

    <div style="font-size:60px;">❤️</div>

    <h1>¿Me quieres?</h1>

    <p>Solo tengo una pregunta para ti...</p>

    <button class="si" onclick="responder('Sí ❤️')">
      Sí ❤️
    </button>

    <button class="no" onclick="responder('No 😭')">
      No 😭
    </button>

    <button id="baby" onclick="baby()">
      Baby ❤️
    </button>

    <p id="mensaje"></p>

  </div>

  <script>

    function responder(respuesta) {

      document.getElementById("mensaje").innerHTML =
        respuesta;

      document.getElementById("baby").style.display =
        "block";
    }

    function baby() {

      document.getElementById("mensaje").innerHTML =
        "🥰 Continuemos... ❤️";

    }

  </script>

</body>
</html>
